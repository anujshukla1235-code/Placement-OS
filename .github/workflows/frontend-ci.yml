name: Frontend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  frontend-build:
    name: Frontend: typecheck, lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: placement-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('placement-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: ESLint
        run: |
          # run eslint if configured in package.json
          npm run lint --if-present

      - name: Build Next.js
        run: npm run build
