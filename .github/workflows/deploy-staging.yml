name: Deploy to Staging

on:
  push:
    branches: ['staging']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (staging)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to remote host via SSH and docker-compose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            # adjust DEPLOY_PATH via secret
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            # make sure docker-compose is available and pull latest images then bring up
            docker-compose pull || true
            docker-compose up -d --build

# Required secrets for this workflow (configure in the repo Settings > Secrets):
# - STAGING_HOST
# - STAGING_USER
# - STAGING_SSH_KEY (private key)
# - STAGING_SSH_PORT (optional, default 22)
# - STAGING_DEPLOY_PATH (path on remote where docker-compose.yml lives)
