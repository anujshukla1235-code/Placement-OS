name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend-tests:
    name: Backend: lint, migrations & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Black format check
        run: |
          # run black in check mode; fails if formatting is required
          python -m black --version || python -m pip install black
          python -m black --check .

      - name: Flake8 lint
        run: |
          # run flake8 (install if missing)
          python -m flake8 --version || python -m pip install flake8
          python -m flake8

      - name: Check for missing migrations
        run: |
          # this exits non-zero if migrations need to be created
          python manage.py makemigrations --dry-run --check

      - name: Run tests with pytest
        run: |
          python -m pytest -q

    # optional: provide a clearer failure summary
    continue-on-error: false
